schema_version: 1

context:
  name: gpf-core
  version: ${{ env.get("VCS_VERSION") | default("0.0.0.dev0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # `uv build` writes a `.gitignore` with `*` into the dist dir; rattler-build
  # honours .gitignore by default and would skip every wheel/sdist, so we
  # opt out here.
  - path: ../../dist/core
    use_gitignore: false
  - path: ../../LICENSE

build:
  noarch: python
  number: 0
  script:
    interpreter: bash
    content: |
      set -euo pipefail
      ls -la
      "$PYTHON" -m pip install --no-deps --no-build-isolation -vv ./*.whl

requirements:
  host:
    - python >=3.12
    - pip
  # Held to core/pyproject.toml's [project.dependencies] under the
  # conda name table in scripts/conda_env.py, by
  # core/tests/small/test_conda_deps.py. Rows for workspace members and
  # gain-core are compared by name only; every other row exactly.
  run:
    - python >=3.12
    - cerberus >=1.3
    - deprecation >=2.1
    - fsspec >=2026.2
    # Pinned to the gain release the gpf release was cut against when
    # gpf-release passes GAIN_CORE_SPEC (e.g. "==2026.9.2", derived from
    # its GAIN_PIN_VERSION param). Unset — master CI, local builds — it
    # renders as a bare `gain-core`. NB: `env.get(...) | default(...)`
    # raises on a missing variable; only the `default=` kwarg form works.
    - gain-core ${{ env.get("GAIN_CORE_SPEC", default="") }}
    - jinja2 >=3.1
    - lark >=1.2
    - matplotlib-base >=3.8
    - networkx >=3.6
    - numpy >=2.2,<3
    - pandas >=3.1
    - pyarrow >=18
    - pydantic >=2.8,<3
    - pysam >=0.23
    - python-box >=7.1
    # python-duckdb is the conda-forge name of PyPI's `duckdb`.
    - python-duckdb >=1.5,<2
    - pyyaml >=6
    - s3fs >=2026.2
    - scikit-learn >=1.5
    - scipy >=1.15
    - seaborn >=0.13
    - sqlglot >=28,<29
    - toml >=0.10

about:
  homepage: https://github.com/iossifovlab/gpf
  summary: GPF — Genotypes and Phenotypes in Families (core library)
  license: MIT
  license_file: LICENSE
