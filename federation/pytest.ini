[pytest]

junit_family=xunit1

# Keep only the tmp_path dirs of failed tests: the kept dirs of passing
# runs exhausted the inodes of the tmpfs /tmp on pooh (seqpipe/infra#435).
tmp_path_retention_policy = failed

# install pytest-cache and pytest-django
# django_find_project = false

DJANGO_SETTINGS_MODULE = gpf_web.test_settings
# addopts = -v
