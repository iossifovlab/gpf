services:

  minio:
    # tb-eqh: pinned to a known-good release. Late-2023 MinIO removed
    # curl from the image (switched to ubi-micro), and `:latest` would
    # silently break the curl-based healthcheck on any agent that
    # pulled fresh. Different agents (eyoree/pooh/piglet) cached
    # different `:latest` resolutions over time — likely a contributor
    # to the 27-test S3 flake. Pin so the image we test against
    # matches what we ship.
    # See: github.com/minio/minio/issues/18372 + /18389
    #
    # gpf#1021 (port of gain#1476): pulled from quay.io, not Docker
    # Hub. The `minio/minio` and `minio/mc` repositories vanished from
    # Docker Hub (404 on the repository itself, verified 2026-09-15),
    # so any agent without a cached copy fails `compose up` with "pull
    # access denied ... repository does not exist" — and the fleet's
    # daily `docker image prune` evicts that cache. quay.io publishes
    # the same tag with the same manifest digest (sha256:14cea493…),
    # so the bytes the tests run against are unchanged.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      # tb-eqh: switched from `curl http://localhost:9000/minio/health/live`
      # to `mc ready local` — official MinIO pattern. The minio image
      # has `mc` at /usr/bin/mc and the `local` alias preconfigured
      # to http://localhost:9000. `mc ready` polls the cluster-readiness
      # endpoint and exits 0 when ready; under docker's timeout=5s
      # it gets killed and reported unhealthy if not.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-client:
    # quay.io for the same reason as `minio` above (gpf#1021).
    image: quay.io/minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/test-bucket;
      "
    depends_on:
      minio:
        condition: service_healthy

  apache:
    image: httpd:latest
    expose:
      - "80"
    volumes:
      - ./core/tests/.test_grr:/usr/local/apache2/htdocs/

  mail:
    image: axllent/mailpit:latest
    hostname: mail
    expose:
      - "1025"
      - "8025"
