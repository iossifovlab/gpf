# The S3 fixture server: RustFS, a maintained, Apache-2.0, S3-compatible
# server -- the same image and setup as gain's fixture (gain#1708,
# gpf#1029). It replaces the archived MinIO community edition, whose
# images we had to re-host on registry.seqpipe.org (gpf#1027). Public on
# Docker Hub, so pulling needs no login. Pinned by the multi-arch
# (amd64 + arm64) index digest of the 1.0.0 release, so every agent and
# workstation runs the same bytes. Why RustFS over SeaweedFS is recorded
# on gain#1708 and in gain's docker-compose.yaml.
x-s3-image: &s3-image rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff

services:

  s3:
    image: *s3-image
    expose:
      - "9000"
      - "9001"
    environment:
      # The credentials every s3 test helper (gain's and gpf's conftest)
      # defaults to.
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      # A test fixture has no business calling home.
      RUSTFS_CHECK_UPDATES: "false"
    healthcheck:
      # curl ships in the image; /health/live answers 200 once the
      # server takes requests.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null",
             "http://localhost:9000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3-setup:
    # One-shot: creates `test-bucket`, then exits. It reuses the server
    # image for its curl, whose --aws-sigv4 signs the S3 CreateBucket
    # request -- so no second image and no vendor client. Creating a
    # bucket that already exists answers 200, so re-running is harmless;
    # -f makes any other answer (a wrong secret is 403) fail the run.
    image: *s3-image
    entrypoint:
      - curl
      - -fsS
      - --aws-sigv4
      - aws:amz:us-east-1:s3
      - --user
      - minioadmin:minioadmin
      - -X
      - PUT
      - http://s3:9000/test-bucket
    depends_on:
      s3:
        condition: service_healthy

  apache:
    image: httpd:latest
    expose:
      - "80"
    volumes:
      - ./core/tests/.test_grr:/usr/local/apache2/htdocs/

  mail:
    image: axllent/mailpit:latest
    hostname: mail
    expose:
      - "1025"
      - "8025"
