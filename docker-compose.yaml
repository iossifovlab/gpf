services:

  minio:
    # tb-eqh: pinned to a known-good release. Late-2023 MinIO removed
    # curl from the image (switched to ubi-micro), and `:latest` would
    # silently break the curl-based healthcheck on any agent that
    # pulled fresh. Different agents (eyoree/pooh/piglet) cached
    # different `:latest` resolutions over time — likely a contributor
    # to the 27-test S3 flake. Pin so the image we test against
    # matches what we ship.
    # See: github.com/minio/minio/issues/18372 + /18389
    #
    # gpf#1027 (port of gain#1706): served from our own registry.
    # MinIO withdrew the `minio/minio` and `minio/mc` images from
    # Docker Hub (2026-09-11, gpf#1021) and then from quay.io
    # (2026-09-24); the community edition is archived, so there is no
    # upstream left to point at. This is the last community release
    # as pooh's cache held it, re-pushed unchanged (upstream index
    # digest sha256:14cea493…) as an amd64 + arm64 index, pinned by
    # that index's digest. The registry needs a login even to pull:
    # CI takes it from the `registry.seqpipe.org` Jenkins credential;
    # on a workstation run `docker login registry.seqpipe.org` once
    # (LAN / VPN only).
    image: registry.seqpipe.org/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:fef3b9cf8ce1bcb83cd30b9a41273c8585855c0a269fa97cf297c6615745b969
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      # tb-eqh: switched from `curl http://localhost:9000/minio/health/live`
      # to `mc ready local` — official MinIO pattern. The minio image
      # has `mc` at /usr/bin/mc and the `local` alias preconfigured
      # to http://localhost:9000. `mc ready` polls the cluster-readiness
      # endpoint and exits 0 when ready; under docker's timeout=5s
      # it gets killed and reported unhealthy if not.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-client:
    # Our registry, for the same reason as `minio` above (gpf#1027).
    # Pinned to the release the old `mc:latest` resolved to (upstream
    # index digest sha256:a7fe349e…) — `latest` no longer exists anywhere.
    image: registry.seqpipe.org/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:b13adbe0366ec9311957246a2303d69f561f224e58a6eed6687e25db27791bc5
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/test-bucket;
      "
    depends_on:
      minio:
        condition: service_healthy

  apache:
    image: httpd:latest
    expose:
      - "80"
    volumes:
      - ./core/tests/.test_grr:/usr/local/apache2/htdocs/

  mail:
    image: axllent/mailpit:latest
    hostname: mail
    expose:
      - "1025"
      - "8025"
